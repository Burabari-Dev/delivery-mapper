name: Build Customer App

on:
  push:
    branches:
      - main
    paths:
      - 'customer-app/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'customer-app/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: customer-app

      - name: Build project
        run: npm run build
        working-directory: customer-app
